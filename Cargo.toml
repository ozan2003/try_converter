[package]
name = "try_conv"
version = "0.2.1"
edition = "2024"
publish = false
license-file = "LICENSE"
description = "Turkish lira amount reader: spells amounts out in Turkish and shows the 2005 redenomination equivalent"

[dependencies]
bitvec = "1.1.1"
eframe = "0.36.2"

[lints.clippy]
# Base Lint Levels
correctness = { level = "forbid", priority = -10 }
perf = { level = "forbid", priority = -20 }
pedantic = { level = "deny", priority = -3 }
style = { level = "warn", priority = -4 }
complexity = { level = "warn", priority = -5 }
suspicious = { level = "warn", priority = -6 }

# Documentation
doc_paragraphs_missing_punctuation = { level = "warn", priority = -8 }
missing_docs_in_private_items = { level = "warn", priority = -9 }
too_long_first_doc_paragraph = { level = "warn", priority = -0 }
doc_broken_link = { level = "warn", priority = -1 }
doc_comment_double_space_linebreaks = { level = "warn", priority = -2 }

# Memory & Safety
undocumented_unsafe_blocks = { level = "deny", priority = -0 }
unnecessary_safety_doc = { level = "warn", priority = -0 }
unnecessary_safety_comment = { level = "warn", priority = 0 }
multiple_unsafe_ops_per_block = { level = "warn", priority = 0 }
mem_forget = { level = "warn", priority = 0 }
as_ptr_cast_mut = { level = "warn", priority = 0 }
rc_mutex = { level = "warn", priority = 0 }

# Floating Point Math
lossy_float_literal = { level = "warn", priority = 0 }
float_cmp = { level = "warn", priority = 0 }
float_cmp_const = { level = "warn", priority = 0 }
while_float = { level = "warn", priority = 0 }
imprecise_flops = { level = "warn", priority = 0 }
suboptimal_flops = { level = "warn", priority = 0 }
cast_sign_loss = { level = "warn", priority = 0 }
invalid_upcast_comparisons = { level = "warn", priority = 0 }
cast_possible_wrap = { level = "warn", priority = 0 }
cast_precision_loss = { level = "warn", priority = 0 }
cast_possible_truncation = { level = "warn", priority = 0 }

# Collections & Iterators
string_slice = { level = "warn", priority = 0 }
collection_is_never_read = { level = "warn", priority = 0 }
iter_on_empty_collections = { level = "warn", priority = 0 }
iter_on_single_items = { level = "warn", priority = 0 }
needless_collect = { level = "warn", priority = 0 }
search_is_some = { level = "warn", priority = 0 }
indexing_slicing = { level = "warn", priority = 0 }
iter_not_returning_iterator = { level = "warn", priority = 0 }

# Async & Concurrency
await_holding_lock = { level = "warn", priority = 0 }
await_holding_refcell_ref = { level = "warn", priority = 0 }
large_futures = { level = "warn", priority = 0 }

# Panics & Error Handling
unwrap_used = { level = "warn", priority = 0 }                 # Prefer ? or expect
get_unwrap = { level = "warn", priority = 0 }
panic = { level = "warn", priority = 0 }
todo = { level = "warn", priority = 0 }
unimplemented = { level = "warn", priority = 0 }
unreachable = { level = "warn", priority = 0 }
unwrap_in_result = { level = "warn", priority = 0 }
panic_in_result_fn = { level = "warn", priority = 0 }
let_underscore_future = { level = "warn", priority = 0 }
unused_result_ok = { level = "warn", priority = 0 }
map_err_ignore = { level = "warn", priority = 0 }
assertions_on_result_states = { level = "warn", priority = 0 }
fallible_impl_from = { level = "warn", priority = 0 }
infallible_try_from = { level = "warn", priority = 0 }

# Idioms & Style
redundant_clone = { level = "warn", priority = -4 }
derive_partial_eq_without_eq = { level = "warn", priority = -5 }
unnecessary_struct_initialization = { level = "warn", priority = -6 }
redundant_pub_crate = { level = "warn", priority = -7 }
missing_const_for_fn = { level = "deny", priority = -9 }
needless_raw_strings = { level = "warn", priority = -1 }
branches_sharing_code = { level = "warn", priority = -1 }
unused_trait_names = { level = "warn", priority = -2 }
min_ident_chars = { level = "warn", priority = -2 }
or_fun_call = { level = "warn", priority = 0 }
path_buf_push_overwrite = { level = "deny", priority = 0 }
uninlined_format_args = { level = "allow", priority = 0 }
unchecked_time_subtraction = { level = "deny", priority = 0 }
use_self = { level = "warn", priority = 0 }
useless_let_if_seq = { level = "warn", priority = 0 }
str_to_string = { level = "warn", priority = 0 }
if_then_some_else_none = { level = "warn", priority = 0 }
equatable_if_let = { level = "warn", priority = 0 }
enum_glob_use = { level = "warn", priority = 0 }
needless_pass_by_ref_mut = { level = "warn", priority = 0 }
needless_type_cast = { level = "warn", priority = 0 }
debug_assert_with_mut_call = { level = "warn", priority = 0 }
expl_impl_clone_on_copy = { level = "warn", priority = 0 }
dbg_macro = { level = "warn", priority = 0 }
allow_attributes = { level = "warn", priority = 0 }
allow_attributes_without_reason = { level = "warn", priority = 0 }
arithmetic_side_effects = { level = "warn", priority = 0 }

# Restriction
wildcard_enum_match_arm = { level = "warn", priority = 0 }           # exhaustive matches on state enums
use_debug = { level = "warn", priority = 0 }                         # Debug formatting in rendered output
iter_over_hash_type = { level = "warn", priority = 0 }               # deterministic iteration order
precedence_bits = { level = "warn", priority = 0 }                   # bitflag/shift mixing
suspicious_xor_used_as_pow = { level = "warn", priority = 0 }
string_add = { level = "warn", priority = 0 }                        # i don't like operator overloading
string_lit_chars_any = { level = "warn", priority = 0 }
filetype_is_file = { level = "warn", priority = 0 }                  # symlinks and special files
verbose_file_reads = { level = "warn", priority = 0 }
pathbuf_init_then_push = { level = "warn", priority = 0 }
partial_pub_fields = { level = "warn", priority = 0 }
same_name_method = { level = "warn", priority = 0 }
rest_pat_in_fully_bound_structs = { level = "warn", priority = 0 }
unneeded_field_pattern = { level = "warn", priority = 0 }
ref_patterns = { level = "warn", priority = 0 }
try_err = { level = "warn", priority = 0 }
return_and_then = { level = "warn", priority = 0 }
redundant_type_annotations = { level = "warn", priority = 0 }
empty_structs_with_brackets = { level = "warn", priority = 0 }
empty_enum_variants_with_brackets = { level = "warn", priority = 0 }
empty_drop = { level = "warn", priority = 0 }
deref_by_slicing = { level = "warn", priority = 0 }
missing_asserts_for_indexing = { level = "warn", priority = 0 }
exit = { level = "warn", priority = 0 }                              # exit() skips TerminalGuard::drop

# Manifest hygiene
wildcard_dependencies = { level = "warn", priority = 0 }
negative_feature_names = { level = "warn", priority = 0 }
redundant_feature_names = { level = "warn", priority = 0 }
cargo_common_metadata = { level = "warn", priority = 0 }

# Nursery
literal_string_with_formatting_args = { level = "warn", priority = 0 }
suspicious_operation_groupings = { level = "warn", priority = 0 }
unused_peekable = { level = "warn", priority = 0 }
clear_with_drain = { level = "warn", priority = 0 }
iter_with_drain = { level = "warn", priority = 0 }
doc_link_code = { level = "warn", priority = 0 }
type_repetition_in_bounds = { level = "warn", priority = 0 }
trait_duplication_in_bounds = { level = "warn", priority = 0 }
nonstandard_macro_braces = { level = "warn", priority = 0 }

# rustc lints (not exposed through clippy)
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_copy_implementations = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
variant_size_differences = "warn"
single_use_lifetimes = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
meta_variable_misuse = "warn"
unit_bindings = "warn"
absolute_paths_not_starting_with_crate = "warn"
if_let_rescope = "warn"
tail_expr_drop_order = "warn"
